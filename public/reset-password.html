<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password - SmartAR Farm Explorer</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #f9fbf9;
            color: #333;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 360px;
            background: #ffffff;
            padding: 32px 28px;
            border-radius: 16px;
            box-shadow: 0 4px 24px rgba(27, 94, 32, 0.06);
            border: 1px solid #eef4ef;
        }

        .brand-header {
            text-align: center;
            margin-bottom: 24px;
        }

        .app-icon {
            width: 64px;
            height: 64px;
            object-fit: contain;
            margin-bottom: 12px;
        }

        h1 {
            text-align: center;
            color: #1B5E20;
            font-size: 20px;
            font-weight: 700;
            letter-spacing: -0.3px;
            margin-bottom: 6px;
        }

        .subtitle {
            text-align: center;
            color: #666666;
            font-size: 13px;
            line-height: 1.4;
        }

        .form-group {
            margin-bottom: 16px;
        }

        label {
            display: block;
            margin-bottom: 6px;
            font-weight: 600;
            color: #333333;
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .input-wrapper {
            position: relative;
            display: flex;
            align-items: center;
        }

        input {
            width: 100%;
            padding: 10px 40px 10px 12px;
            border: 1px solid #e0e0e0;
            border-radius: 8px;
            font-size: 13px;
            color: #333;
            background-color: #fff;
            transition: all 0.2s ease;
            outline: none;
        }

        input:focus {
            border-color: #1B5E20;
            box-shadow: 0 0 0 3px rgba(27, 94, 32, 0.1);
        }

        .toggle-password {
            position: absolute;
            right: 12px;
            background: none;
            border: none;
            cursor: pointer;
            padding: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #666;
            width: auto;
        }

        .toggle-password svg {
            width: 18px;
            height: 18px;
            fill: none;
            stroke: #666666;
            stroke-width: 2;
            stroke-linecap: round;
            stroke-linejoin: round;
            transition: stroke 0.2s ease;
        }

        .toggle-password:hover svg {
            stroke: #1B5E20;
        }

        button[type="submit"] {
            width: 100%;
            padding: 11px;
            border: none;
            border-radius: 8px;
            background: #1B5E20;
            color: #ffffff;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            margin-top: 8px;
            transition: background-color 0.2s ease, transform 0.1s ease;
        }

        button[type="submit"]:hover {
            background: #144718;
        }

        button[type="submit"]:active {
            transform: scale(0.99);
        }

        button[type="submit"]:disabled {
            background: #a5d6a7;
            cursor: not-allowed;
        }

        #message {
            text-align: center;
            margin-top: 14px;
            font-size: 12px;
            line-height: 1.4;
        }

        .success {
            color: #1B5E20;
            font-weight: 500;
        }

        .error {
            color: #d32f2f;
            font-weight: 500;
        }
    </style>
</head>

<body>

<div class="container">

    <div class="brand-header">
        <img src="https://tse4.mm.bing.net/th/id/OIP.IK9HZGVdsDSJLZJh5BXTMAHaHa?r=0&rs=1&pid=ImgDetMain&o=7&rm=3" alt="SmartAR Icon" class="app-icon">
        <h1>Reset Password</h1>
        <p class="subtitle">Enter your new account password below.</p>
    </div>

    <form id="resetForm">

        <div class="form-group">
            <label for="password">New Password</label>
            <div class="input-wrapper">
                <input
                    type="password"
                    id="password"
                    placeholder="Enter new password"
                    required
                >
                <button type="button" class="toggle-password" onclick="toggleVisibility('password', this)" aria-label="Toggle password visibility">
                    <svg viewBox="0 0 24 24"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg>
                </button>
            </div>
        </div>

        <div class="form-group">
            <label for="confirmPassword">Confirm Password</label>
            <div class="input-wrapper">
                <input
                    type="password"
                    id="confirmPassword"
                    placeholder="Confirm new password"
                    required
                >
                <button type="button" class="toggle-password" onclick="toggleVisibility('confirmPassword', this)" aria-label="Toggle password visibility">
                    <svg viewBox="0 0 24 24"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg>
                </button>
            </div>
        </div>

        <button type="submit" id="resetButton">Update Password</button>

    </form>

    <div id="message"></div>

</div>

<script>
    function toggleVisibility(inputId, btn) {
        const input = document.getElementById(inputId);
        const isPassword = input.type === "password";
        
        input.type = isPassword ? "text" : "password";
        
        btn.innerHTML = isPassword 
            ? `<svg viewBox="0 0 24 24"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path><line x1="1" y1="1" x2="23" y2="23"></line></svg>`
            : `<svg viewBox="0 0 24 24"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg>`;
    }

    const urlParams = new URLSearchParams(window.location.search);
    const token = urlParams.get("token");

    const form = document.getElementById("resetForm");
    const button = document.getElementById("resetButton");
    const message = document.getElementById("message");

    if (!token) {
        form.style.display = "none";
        message.textContent = "Invalid or missing password reset link.";
        message.className = "error";
    }

    form.addEventListener("submit", async function(event) {
        event.preventDefault();

        const password = document.getElementById("password").value;
        const confirmPassword = document.getElementById("confirmPassword").value;

        message.textContent = "";
        message.className = "";

        if (password.length < 6) {
            message.textContent = "Password must be at least 6 characters.";
            message.className = "error";
            return;
        }

        if (password !== confirmPassword) {
            message.textContent = "Passwords do not match.";
            message.className = "error";
            return;
        }

        button.disabled = true;
        button.textContent = "Updating...";

        try {
            const response = await fetch("/auth/reset-password", {
                method: "POST",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify({
                    token: token,
                    new_password: password
                })
            });

            const data = await response.json();

            if (response.ok) {
                form.style.display = "none";
                message.textContent = "Password updated successfully! You can now log in.";
                message.className = "success";
            } else {
                message.textContent = data.error || "Failed to reset password.";
                message.className = "error";
                button.disabled = false;
                button.textContent = "Update Password";
            }
        } catch (error) {
            message.textContent = "Unable to connect to the server.";
            message.className = "error";
            button.disabled = false;
            button.textContent = "Update Password";
        }
    });
</script>

</body>
</html>
